name: Build CloudStream Extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build CloudStream extension
        run: ./gradlew make --no-daemon

      - name: Upload CS3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-cs3
          path: '**/build/**/*.cs3'
          if-no-files-found: error
